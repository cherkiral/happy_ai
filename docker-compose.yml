services:
  bot:
    build: .
    container_name: ai_voice_bot
    restart: always
    env_file:
      - .env
    environment:
      - DOCKER_MODE=true ##чтобы нормально делать миграции и не менять локалхост на дб
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    container_name: ai_voice_db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7.2
    container_name: ai_voice_redis
    restart: always
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}" ]
    volumes:
      - redis_data:/data

volumes:
  pg_data:
  redis_data:
